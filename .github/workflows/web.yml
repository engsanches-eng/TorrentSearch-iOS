name: "Web: testa buscadores e publica no Cloudflare"

on:
  push:
    branches: [main]
    paths: ["web/**", "worker/**", "wrangler.toml", "tests/web-providers.mjs", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe
        run: for f in web/*.js worker/index.js; do node --check "$f" || exit 1; done
      - name: Teste ao vivo dos buscadores (jsdom)
        run: |
          npm i --no-save jsdom@25 >/dev/null
          REPORT_PATH=$PWD/web-report.json node tests/web-providers.mjs | tee web-test.log
      - name: Publicar relatório no branch ci-results-web
        if: always()
        run: |
          mkdir -p /tmp/out && cp web-report.json web-test.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q -b ci-results-web && git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "web ${GITHUB_SHA::7}" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results-web

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar segredos
        id: s
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then echo "::warning::Segredos do Cloudflare não configurados; deploy pulado"; echo "ok=0" >> $GITHUB_OUTPUT; else echo "ok=1" >> $GITHUB_OUTPUT; fi
      - name: Deploy no Cloudflare Workers
        if: steps.s.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          URL=$(grep -oE "https://[a-z0-9.-]+\.workers\.dev" deploy.log | head -1)
          echo "::notice title=URL::$URL"
