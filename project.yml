name: TorrentSearch
options:
  bundleIdPrefix: com.glauber
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: pt-BR
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0
targets:
  TorrentSearch:
    type: application
    platform: iOS
    sources:
      - App
      - UI
      - Sources/TorrentSearchCore
      - Resources
    dependencies:
      - package: SwiftSoup
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Torrent Search
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSApplicationQueriesSchemes: [magnet]
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Usado somente para conectar ao seu próprio servidor Jackett/Prowlarr na rede local, se você configurar um.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glauber.torrentsearch
        MARKETING_VERSION: 0.5.2
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Manual
