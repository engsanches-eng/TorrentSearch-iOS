<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Torrent Search">
  <meta name="theme-color" content="#14998f">
  <meta name="referrer" content="no-referrer">
  <title>Torrent Search</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="top">
    <button id="back" class="icon-btn" hidden aria-label="Voltar">‹</button>
    <h1 id="title">Torrent Search</h1>
    <div id="top-actions"></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav id="tabs" role="tablist">
    <button data-tab="search" role="tab"><span class="ti">⌕</span><span data-t>Buscar</span></button>
    <button data-tab="browse" role="tab"><span class="ti">✦</span><span data-t>Explorar</span></button>
    <button data-tab="bookmarks" role="tab"><span class="ti">★</span><span data-t>Favoritos</span></button>
    <button data-tab="settings" role="tab"><span class="ti">⚙</span><span data-t>Ajustes</span></button>
  </nav>
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-card" id="sheet-card"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/i18n.js"></script>
  <script src="/core.js"></script>
  <script src="/providers.js"></script>
  <script src="/app.js"></script>
</body>
</html>
